[package]
name = "tek4051-emulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
default = ["native"]
native = ["dep:eframe", "dep:image", "dep:rfd"]
wasm = ["dep:wasm-bindgen", "webgpu"]
webgpu = ["dep:wgpu", "eframe?/wgpu"]

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tek4051-emulator"
path = "main.rs"
required-features = ["native"]

[[bench]]
name = "battlestar_programs"
harness = false

[dependencies]
eframe = { version = "0.32.3", optional = true }
image = { version = "=0.25.9", optional = true, default-features = false, features = ["png"] }
jiff = "0.2"
rfd = { version = "0.17.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wgpu = { version = "=25.0.2", optional = true, features = ["wgsl"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate-miniz"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
jiff = { version = "0.2", features = ["js"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
web-time = "1.1.0"

[dev-dependencies]
pollster = "0.4.0"
tempfile = "3.27.0"
